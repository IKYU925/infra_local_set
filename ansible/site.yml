# K3s 클러스터 구성 플레이북
# 실행: cd ansible && ansible-playbook site.yml
# 일부만: ansible-playbook site.yml --tags dashboard  (태그: common, server, agent, registry, dashboard, status)
# 플레이는 위에서부터 순서대로 실행된다 (server 완료 후 agent 조인)

- name: 1. 전체 노드 공통 설정
  tags: [common]
  hosts: k3s_cluster
  become: true
  roles:
    - common

- name: 2. ControlPlane - K3s server 설치
  tags: [server]
  hosts: servers
  become: true
  roles:
    - k3s_server

- name: 3. Worker - K3s agent 조인
  tags: [agent]
  hosts: agents
  become: true
  roles:
    - k3s_agent

- name: 4. 로컬 이미지 레지스트리 (선택)
  tags: [registry]
  hosts: k3s_cluster
  become: true
  roles:
    - role: registry
      when: install_registry | bool

- name: 5. 웹 UI - Headlamp (선택)
  tags: [dashboard, headlamp]
  hosts: servers
  become: true
  roles:
    - role: headlamp
      when: install_dashboard | bool

- name: 6. 클러스터 상태 확인
  tags: [status]
  hosts: servers
  become: true
  tasks:
    - name: 모든 노드 Ready 대기
      ansible.builtin.command: k3s kubectl wait --for=condition=Ready nodes --all --timeout=180s
      changed_when: false

    - name: 노드 목록 조회
      ansible.builtin.command: k3s kubectl get nodes -o wide
      register: nodes
      changed_when: false

    - name: 결과 출력
      ansible.builtin.debug:
        var: nodes.stdout_lines
