# Worker: 마스터 API 대기 후 K3s agent 로 조인

- name: 마스터 API(6443) 대기
  ansible.builtin.wait_for:
    host: "{{ master_ip }}"
    port: 6443
    timeout: 300

- name: K3s agent 설치 및 조인
  ansible.builtin.shell: >
    set -o pipefail &&
    curl -sfL https://get.k3s.io |
    INSTALL_K3S_VERSION="{{ k3s_version }}"
    K3S_URL="https://{{ master_ip }}:6443"
    K3S_TOKEN="{{ k3s_token }}"
    sh -s - agent
    --node-ip={{ node_ip }}
    --flannel-iface={{ k3s_iface }}
  args:
    executable: /bin/bash
    creates: /usr/local/bin/k3s-agent-uninstall.sh

- name: k3s-agent 서비스 실행 확인
  ansible.builtin.systemd:
    name: k3s-agent
    state: started
    enabled: true

# 노드 라벨: 워크로드를 노드별로 나눠 배치하기 위한 라벨 (host_vars/<노드>.yml 의 node_labels)
# 이미 조인된 노드에도 적용되도록 설치 옵션(--node-label) 대신 kubectl label 로 붙인다 (재실행 안전)
- name: 노드 Ready 대기 (라벨 적용 전)
  ansible.builtin.command: k3s kubectl wait --for=condition=Ready node/{{ inventory_hostname }} --timeout=30s
  register: agent_ready
  until: agent_ready.rc == 0
  retries: 20
  delay: 5
  changed_when: false
  delegate_to: "{{ groups['servers'][0] }}"
  when: node_labels | default([]) | length > 0

- name: 노드 라벨 적용
  ansible.builtin.command: k3s kubectl label node {{ inventory_hostname }} {{ item }} --overwrite
  loop: "{{ node_labels | default([]) }}"
  register: label_result
  changed_when: "'not labeled' not in label_result.stdout"
  delegate_to: "{{ groups['servers'][0] }}"
