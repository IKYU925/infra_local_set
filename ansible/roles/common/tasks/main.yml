# 전체 노드 공통 설정: 시간대, /etc/hosts, K3s 가 쓸 NIC 탐지

- name: 현재 시간대 확인
  ansible.builtin.command: timedatectl show -p Timezone --value
  register: current_tz
  changed_when: false

- name: 시간대 설정
  ansible.builtin.command: timedatectl set-timezone {{ timezone }}
  when: current_tz.stdout != timezone

# 맥이 잠들면 VM이 멈췄다가 시계가 늦은 채로 깨어난다(15분 넘게 밀린 적이 있다).
# 박스 기본값은 NTP가 꺼져 있고 폴링 간격이 최대 34분이라 1분 안에 따라잡게 한다
- name: timesyncd 설정 폴더
  ansible.builtin.file:
    path: /etc/systemd/timesyncd.conf.d
    state: directory
    mode: "0755"

- name: NTP 폴링 간격 상한
  ansible.builtin.copy:
    dest: /etc/systemd/timesyncd.conf.d/10-k3s-lab.conf
    content: |
      [Time]
      PollIntervalMaxSec=64
    mode: "0644"
  register: timesyncd_conf

- name: NTP 동기화 상태 확인
  ansible.builtin.command: timedatectl show -p NTP --value
  register: ntp_enabled
  changed_when: false

- name: NTP 동기화 켜기
  ansible.builtin.command: timedatectl set-ntp true
  when: ntp_enabled.stdout != "yes"

- name: timesyncd 재시작(설정 변경 시)
  ansible.builtin.systemd:
    name: systemd-timesyncd
    state: restarted
  when: timesyncd_conf.changed

# Vagrant 가 넣는 "127.0.x.1 <hostname>" 줄을 지워서
# 호스트명이 루프백이 아니라 private IP 로 풀리게 한다
- name: 루프백 호스트명 항목 제거
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.[1-9][0-9]*\.1\s'
    state: absent

- name: 클러스터 노드 /etc/hosts 등록
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} K3S CLUSTER (ansible)"
    block: |
      {% for host in groups['k3s_cluster'] %}
      {{ hostvars[host]['ansible_host'] }} {{ host }}
      {% endfor %}

# VM 에는 NIC 가 2개(NAT + private) 있으므로,
# ansible_host(private IP) 가 붙은 NIC 이름을 찾아 K3s 에 넘긴다
- name: 노드 IP 가 할당된 NIC 찾기
  ansible.builtin.shell: >
    ip -o -4 addr show |
    awk -v ip="{{ ansible_host }}" '{split($4,a,"/"); if (a[1]==ip) print $2}'
  register: node_iface
  changed_when: false
  failed_when: node_iface.stdout == ""

- name: 노드 네트워크 정보 저장
  ansible.builtin.set_fact:
    node_ip: "{{ ansible_host }}"
    k3s_iface: "{{ node_iface.stdout }}"

- name: 탐지 결과
  ansible.builtin.debug:
    msg: "node-ip={{ node_ip }}, flannel-iface={{ k3s_iface }}"

- name: 실험용 볼륨(/srv/appdata)
  when: appdata_volume_size is defined
  block:
    - name: 볼륨 파일
      ansible.builtin.command: fallocate -l {{ appdata_volume_size }} /var/lib/appdata.img
      args: {creates: /var/lib/appdata.img}
      register: appdata_img
    - name: ext4 포맷(처음 만들 때만)
      ansible.builtin.command: mkfs.ext4 -q -F /var/lib/appdata.img
      when: appdata_img.changed
    - name: 부팅 때 루프 마운트
      ansible.builtin.lineinfile:
        path: /etc/fstab
        line: "/var/lib/appdata.img /srv/appdata ext4 loop,nofail 0 0"
    - name: 마운트 지점
      ansible.builtin.file: {path: /srv/appdata, state: directory}
    - name: 마운트
      ansible.builtin.shell: findmnt -n /srv/appdata >/dev/null || { mount /srv/appdata && echo mounted; }
      register: appdata_mount
      changed_when: "'mounted' in appdata_mount.stdout"
    - name: 임시 파일 폴더
      ansible.builtin.file: {path: /srv/appdata/tmp, state: directory, mode: "0755"}
