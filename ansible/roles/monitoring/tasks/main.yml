# 관측 도구 설치: kube-prometheus-stack(Prometheus, Alertmanager, Grafana), Loki, Grafana Alloy
# 모두 k3s-w2(workload=monitoring)에 배치한다
# 접속: Grafana http://<노드 IP>:{{ grafana_node_port }}, Prometheus :{{ prometheus_node_port }}, Alertmanager :{{ alertmanager_node_port }}

- name: 관측 도구 설치
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  block:
    - name: Helm 설치
      ansible.builtin.shell: >
        set -o pipefail &&
        curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      args:
        executable: /bin/bash
        creates: /usr/local/bin/helm

    - name: Helm 저장소 등록
      ansible.builtin.command: helm repo add {{ item.name }} {{ item.url }} --force-update
      loop:
        - { name: prometheus-community, url: "https://prometheus-community.github.io/helm-charts" }
        - { name: grafana, url: "https://grafana.github.io/helm-charts" }
      changed_when: false

    - name: Helm 저장소 갱신
      ansible.builtin.command: helm repo update
      changed_when: false

    - name: namespace 생성
      ansible.builtin.shell: >
        set -o pipefail &&
        k3s kubectl create namespace {{ monitoring_namespace }} --dry-run=client -o yaml | k3s kubectl apply -f -
      args:
        executable: /bin/bash
      register: ns_result
      changed_when: "'created' in ns_result.stdout"

    # 비밀번호와 토큰은 values 파일에 넣지 않고 Secret 으로만 전달한다
    - name: Grafana 관리자 Secret
      ansible.builtin.shell: >
        set -o pipefail &&
        k3s kubectl -n {{ monitoring_namespace }} create secret generic grafana-admin
        --from-literal=admin-user=admin
        --from-literal=admin-password={{ grafana_admin_password }}
        --dry-run=client -o yaml | k3s kubectl apply -f -
      args:
        executable: /bin/bash
      register: grafana_secret
      changed_when: "'created' in grafana_secret.stdout or 'configured' in grafana_secret.stdout"
      no_log: true

    - name: Alertmanager 웹훅 인증 토큰 Secret
      ansible.builtin.shell: >
        set -o pipefail &&
        k3s kubectl -n {{ monitoring_namespace }} create secret generic ai-automation-token
        --from-literal=token={{ ai_automation_token }}
        --dry-run=client -o yaml | k3s kubectl apply -f -
      args:
        executable: /bin/bash
      register: token_secret
      changed_when: "'created' in token_secret.stdout or 'configured' in token_secret.stdout"
      no_log: true

    - name: values 디렉터리
      ansible.builtin.file:
        path: /root/monitoring-values
        state: directory
        mode: "0700"

    - name: values 파일 생성
      ansible.builtin.template:
        src: "{{ item }}.values.yaml.j2"
        dest: "/root/monitoring-values/{{ item }}.yaml"
        mode: "0600"
      loop:
        - kube-prometheus-stack
        - loki
        - alloy

    - name: Helm 차트 설치 (kube-prometheus-stack, Loki, Alloy 순서)
      ansible.builtin.command: >
        helm upgrade --install {{ item.release }} {{ item.chart }}
        --version {{ item.version }}
        --namespace {{ monitoring_namespace }}
        -f /root/monitoring-values/{{ item.release }}.yaml
        --wait --timeout 15m
      loop:
        - { release: kube-prometheus-stack, chart: prometheus-community/kube-prometheus-stack, version: "{{ kube_prometheus_stack_chart_version }}" }
        - { release: loki, chart: grafana/loki, version: "{{ loki_chart_version }}" }
        - { release: alloy, chart: grafana/alloy, version: "{{ alloy_chart_version }}" }
      register: helm_result
      changed_when: "'STATUS: deployed' in helm_result.stdout"

    - name: 맥에서 Grafana 응답 확인
      ansible.builtin.uri:
        url: "http://{{ master_ip }}:{{ grafana_node_port }}/api/health"
        status_code: 200
      register: grafana_http
      until: grafana_http.status == 200
      retries: 20
      delay: 5
      delegate_to: localhost
      become: false

    - name: 접속 안내
      ansible.builtin.debug:
        msg:
          - "Grafana: http://{{ master_ip }}:{{ grafana_node_port }}  (admin / 프로젝트 폴더/grafana-admin-password.txt)"
          - "Prometheus: http://{{ master_ip }}:{{ prometheus_node_port }}"
          - "Alertmanager: http://{{ master_ip }}:{{ alertmanager_node_port }}"
          - "Alertmanager 웹훅 대상: {{ ai_automation_webhook_url }}  (토큰: 프로젝트 폴더/.ai-automation-token)"

  rescue:
    - name: 관측 도구 설치 실패 원인
      ansible.builtin.debug:
        msg:
          - "실패한 작업: {{ ansible_failed_task.name }}"
          - "에러: {{ ansible_failed_result.msg | default('') }}"
          - "stderr: {{ ansible_failed_result.stderr | default('') }}"
          - "클러스터는 정상이다. 원인 해결 후 ansible-playbook site.yml --tags monitoring 으로 이 단계만 다시 실행한다."
