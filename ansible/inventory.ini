# Ansible 인벤토리: 노드 목록과 그룹 (servers=ControlPlane, agents=Worker, k3s_cluster=전체)
#
# 호스트 이름은 Vagrantfile 의 노드 이름과 같아야 한다
# (SSH 키 경로 .vagrant/machines/<이름>/... 를 이 이름으로 찾기 때문)

[servers]
controlplane ansible_host=192.168.56.10

[agents]
node01 ansible_host=192.168.56.11
node02 ansible_host=192.168.56.12

[k3s_cluster:children]
servers
agents
